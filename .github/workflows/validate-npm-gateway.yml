name: Validate npm gateway

on:
  push:
    paths:
      - '.github/workflows/validate-npm-gateway.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Wire Gateway and build
        shell: bash
        run: |
          set -euo pipefail
          python3 .airgap-dev/gateway-fixes.py
          gofmt -w internal/adapters/npm/layout.go internal/service/published_file.go internal/server/npm_gateway.go internal/server/api.go cmd/mirror-agent/main.go
          go build ./internal/...
          go build ./cmd/...
      - name: Commit validated Gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -f .airgap-dev/gateway-fixes.py
          rmdir .airgap-dev 2>/dev/null || true
          rm -f .github/workflows/validate-npm-gateway.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire offline npm metadata gateway"
          git push
