name: Validate inventory scanners phase 2

on:
  push:
    paths:
      - '.github/workflows/validate-inventory-phase2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Refactor shared integrity and build
        run: |
          set -euo pipefail
          python .airgap-dev/refactor-integrity.py
          gofmt -w internal/ports/inventory.go internal/integrity/file.go internal/adapters/npm/inventory.go internal/adapters/maven/generic_inventory.go internal/adapters/maven/central_inventory.go internal/service/downloader.go
          go mod tidy
          go build ./internal/...
          go build ./cmd/...
      - name: Commit validated module
        run: |
          set -euo pipefail
          rm -f .airgap-dev/refactor-integrity.py .github/workflows/validate-inventory-phase2.yml
          rmdir .airgap-dev 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: validate npm and Maven inventory scanners'
          git push
# rerun: 2
