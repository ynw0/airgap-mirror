name: Validate Windows maintenance UI

on:
  push:
    paths:
      - '.github/workflows/validate-maintenance-ui.yml'

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Wire maintenance UI and build Go
        shell: bash
        run: |
          set -euo pipefail
          python .airgap-dev/wire-maintenance-ui.py
          gofmt -w internal/client/maintenance.go desktop/maintenance.go
          go mod tidy
          go build ./internal/...
          go build ./cmd/...
      - name: Build React frontend
        working-directory: desktop/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Build Windows Wails executable
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd desktop
          wails build -clean -platform windows/amd64
          test -f build/bin/airgap-mirror.exe
      - uses: actions/upload-artifact@v4
        with:
          name: airgap-mirror-windows-amd64-maintenance
          path: desktop/build/bin/airgap-mirror.exe
          if-no-files-found: error
      - name: Commit validated maintenance UI
        shell: bash
        run: |
          set -euo pipefail
          rm -f .airgap-dev/wire-maintenance-ui.py .github/workflows/validate-maintenance-ui.yml
          rmdir .airgap-dev 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: validate Windows maintenance UI'
          git push
