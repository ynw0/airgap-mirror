name: Temporary PyPI runner gofmt
on:
  push:
    branches: ['feat/pypi-resumable-inventory']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pypi-resumable-inventory
      - name: Format and push
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/service/maintenance_runner_resume_test.go
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/service/maintenance_runner_resume_test.go
            git commit -m "style: gofmt runner resume integration test"
            git push origin HEAD:feat/pypi-resumable-inventory
          fi
