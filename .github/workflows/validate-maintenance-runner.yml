name: Validate maintenance runner

on:
  push:
    paths:
      - '.github/workflows/validate-maintenance-runner.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Format and build
        run: |
          set -euo pipefail
          gofmt -w internal/service/maintenance_runner.go internal/storage/sqlite/server_maintenance_recovery.go internal/server/maintenance.go cmd/mirror-agent/main.go
          go mod tidy
          go build ./internal/...
          go build ./cmd/...
      - name: Commit validated module
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-maintenance-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: validate maintenance runner'
          git push
