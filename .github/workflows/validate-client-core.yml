name: Validate client core

on:
  push:
    paths:
      - '.github/workflows/validate-client-core.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build client core
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/client
          go build ./internal/...
          go build ./cmd/...
      - name: Commit validated client core
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-client-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize resumable Agent client core"
          git push
