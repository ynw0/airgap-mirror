name: Validate Linux deployment

on:
  push:
    paths:
      - '.github/workflows/validate-deploy.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build Linux control binaries
        run: |
          set -euo pipefail
          go build ./internal/...
          go build -o /tmp/mirror-agent ./cmd/mirror-agent
          go build -o /tmp/mirrorctl ./cmd/mirrorctl
      - name: Validate deployment files
        run: |
          set -euo pipefail
          bash -n scripts/install-agent.sh
          systemd-analyze verify deploy/systemd/airgap-mirror-agent.service
          grep -q '^ProxyRequests Off$' deploy/apache/airgap-mirror.conf
          grep -q '127.0.0.1:8787' deploy/apache/airgap-mirror.conf
      - name: Remove validation workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-deploy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: validate Linux deployment module'
          git push
