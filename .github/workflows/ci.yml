name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.go')
          bad="$(gofmt -l "${files[@]}")"
          if [ -n "$bad" ]; then
            printf 'gofmt required:\n%s\n' "$bad"
            exit 1
          fi
      - name: Verify Go modules
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build Go control plane
        run: go build ./internal/... ./cmd/...
      - name: Verify deployment scripts
        shell: bash
        run: bash -n scripts/install-agent.sh

  windows:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Build React frontend
        working-directory: desktop/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Build Windows Wails executable
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd desktop
          wails build -clean -platform windows/amd64
          test -f build/bin/airgap-mirror.exe
      - uses: actions/upload-artifact@v4
        with:
          name: airgap-mirror-windows-amd64
          path: desktop/build/bin/airgap-mirror.exe
          if-no-files-found: error
