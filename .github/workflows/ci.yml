name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.go')
          bad="$(gofmt -l "${files[@]}")"
          if [ -n "$bad" ]; then
            printf 'gofmt required:\n%s\n' "$bad"
            exit 1
          fi
      - name: Verify Go modules
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify GnuPG is available for APT signature tests
        run: gpg --version
      - name: Test Go control plane without CGO
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/... ./cmd/...
      - name: Detect Go data races in maintenance and storage
        run: go test -race ./internal/service/... ./internal/storage/sqlite/... ./internal/client/... ./internal/server/...
      - name: Build Go control plane without CGO
        env:
          CGO_ENABLED: '0'
        run: go build ./internal/... ./cmd/...
      - name: Verify deployment scripts
        shell: bash
        run: |
          bash -n scripts/install-agent.sh
          bash -n internal/server/web/configure-agent.sh
          bash -n internal/server/web/configure-apt-signing.sh

  windows:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Build React frontend
        working-directory: desktop/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Check desktop download layout in Chromium
        working-directory: desktop/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
          node tests/sync-layout.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-layout-screenshots
          path: desktop/frontend/layout-screenshots/
          if-no-files-found: ignore
      - name: Test APT verification without GnuPG on Windows
        shell: bash
        run: go test ./internal/adapters/apt -run 'TestBundledArchiveKeys|TestVerifyReleaseWithoutGnuPG'
      - name: Test Windows report publication
        shell: bash
        run: go test ./desktop/report_publish_windows.go ./desktop/report_publish_test.go
      - name: Build Windows Wails executable
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd desktop
          wails build -clean -platform windows/amd64
          test -f build/bin/airgap-mirror.exe
      - uses: actions/upload-artifact@v4
        with:
          name: airgap-mirror-windows-amd64
          path: desktop/build/bin/airgap-mirror.exe
          if-no-files-found: error
