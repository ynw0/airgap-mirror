name: Validate inventory scanners phase 1

on:
  push:
    paths:
      - '.github/workflows/validate-inventory-phase1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Format and build
        run: |
          set -euo pipefail
          gofmt -w internal/ports/inventory.go internal/adapters/common/localrepo.go internal/adapters/apt/inventory.go internal/adapters/pypi/inventory.go
          go mod tidy
          go build ./internal/...
          go build ./cmd/...
      - name: Commit validated module
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-inventory-phase1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: validate APT and PyPI inventory scanners'
          git push
