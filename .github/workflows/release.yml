name: Publish v0.5.1

on:
  push:
    branches:
      - 'release-build/v0.5.1'

permissions:
  contents: write

jobs:
  linux:
    name: Linux release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0af76e30b14ea3dd086df562a7ed1b6accb38f0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Build Linux binaries without glibc dependency
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          root="dist/airgap-mirror-linux-amd64"
          mkdir -p "$root/bin"
          go build -trimpath -ldflags='-s -w' -o "$root/bin/mirror-agent" ./cmd/mirror-agent
          go build -trimpath -ldflags='-s -w' -o "$root/bin/mirrorctl" ./cmd/mirrorctl
          for binary in "$root/bin/mirror-agent" "$root/bin/mirrorctl"; do
            headers="$(readelf -lW "$binary")"
            dynamic="$(readelf -dW "$binary")"
            if grep -q 'INTERP' <<< "$headers" || grep -q '(NEEDED)' <<< "$dynamic"; then
              echo "error: $binary requires a dynamic loader or shared library" >&2
              exit 1
            fi
          done
      - name: Smoke test Linux binaries on Ubuntu 20.04
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,source=$(realpath dist/airgap-mirror-linux-amd64/bin),target=/airgap,readonly" \
            ubuntu:20.04 bash -ec '
              /airgap/mirror-agent -h
              /airgap/mirrorctl -h
              export AIRGAP_MIRROR_TOKEN=release-smoke-test
              /airgap/mirror-agent -listen 127.0.0.1:8787 -db /tmp/server.db -staging /tmp/staging -exports /tmp/exports -maintenance /tmp/maintenance &
              pid=$!
              trap "kill $pid 2>/dev/null || true; wait $pid || true" EXIT
              for i in $(seq 1 30); do
                if /airgap/mirrorctl health; then
                  /airgap/mirrorctl sources
                  exit 0
                fi
                kill -0 "$pid"
                sleep 1
              done
              exit 1
            '
      - name: Package Linux release bundle
        shell: bash
        run: |
          set -euo pipefail
          root="dist/airgap-mirror-linux-amd64"
          cp -R deploy "$root/deploy"
          mkdir -p "$root/scripts" "$root/docs"
          cp scripts/install-agent.sh "$root/scripts/"
          cp internal/server/web/configure-agent.sh "$root/scripts/"
          cp internal/server/web/configure-apt-signing.sh "$root/scripts/"
          cp README.md LICENSE "$root/"
          cp docs/DEPLOYMENT.md "$root/docs/"
          tar -C dist -czf dist/airgap-mirror-linux-amd64.tar.gz airgap-mirror-linux-amd64
          (cd dist && sha256sum airgap-mirror-linux-amd64.tar.gz > airgap-mirror-linux-amd64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: |
            dist/airgap-mirror-linux-amd64.tar.gz
            dist/airgap-mirror-linux-amd64.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows release bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0af76e30b14ea3dd086df562a7ed1b6accb38f0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Build React frontend
        working-directory: desktop/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Build Windows executable
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd desktop
          wails build -clean -platform windows/amd64
          test -f build/bin/airgap-mirror.exe
      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/airgap-mirror-windows-amd64 | Out-Null
          Copy-Item desktop/build/bin/airgap-mirror.exe dist/airgap-mirror-windows-amd64/
          Copy-Item README.md,LICENSE dist/airgap-mirror-windows-amd64/
          Compress-Archive -Path dist/airgap-mirror-windows-amd64/* -DestinationPath dist/airgap-mirror-windows-amd64.zip -Force
          $hash = (Get-FileHash dist/airgap-mirror-windows-amd64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  airgap-mirror-windows-amd64.zip" | Set-Content -NoNewline dist/airgap-mirror-windows-amd64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: |
            dist/airgap-mirror-windows-amd64.zip
            dist/airgap-mirror-windows-amd64.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v0.5.1" \
            release-assets/airgap-mirror-linux-amd64.tar.gz \
            release-assets/airgap-mirror-linux-amd64.tar.gz.sha256 \
            release-assets/airgap-mirror-windows-amd64.zip \
            release-assets/airgap-mirror-windows-amd64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "c0af76e30b14ea3dd086df562a7ed1b6accb38f0" \
            --title "v0.5.1" \
            --latest \
            --generate-notes
