name: Validate client orchestrator

on:
  push:
    paths:
      - '.github/workflows/validate-client-orchestrator.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build client orchestrator
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/client internal/service/default_registry.go internal/storage/sqlite/client_queries.go cmd/mirror-agent/main.go
          go build ./internal/...
          go build ./cmd/...
      - name: Commit validated formatting and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-client-orchestrator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize client sync orchestrator"
          git push
