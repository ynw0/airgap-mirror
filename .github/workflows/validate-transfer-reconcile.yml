name: Validate transfer reconciliation

on:
  push:
    paths:
      - '.github/workflows/validate-transfer-reconcile.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Apply reconciliation fixes and build
        shell: bash
        run: |
          set -euo pipefail
          python3 .airgap-dev/fix-transfer-reconcile.py
          gofmt -w internal/client
          go build ./internal/...
          go build ./cmd/...
      - name: Commit validated transfer reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .airgap-dev/fix-transfer-reconcile.py
          rmdir .airgap-dev 2>/dev/null || true
          rm -f .github/workflows/validate-transfer-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: reconcile resumable server updates"
          git push
