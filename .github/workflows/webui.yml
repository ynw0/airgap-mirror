name: WebUI browser tests
on:
  pull_request:
    paths:
      - 'internal/server/web/index.html'
      - 'tests/webui_smoke.py'
      - '.github/workflows/webui.yml'
  push:
    branches: [main]
    paths:
      - 'internal/server/web/index.html'
      - 'tests/webui_smoke.py'
      - '.github/workflows/webui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Run embedded WebUI tests
        run: python tests/webui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webui-preview
          path: webui-preview/
          if-no-files-found: ignore
