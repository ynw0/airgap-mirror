name: Validate GC maintenance

on:
  push:
    paths:
      - '.github/workflows/validate-gc.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Wire GC and build
        run: |
          set -euo pipefail
          python .airgap-dev/wire-gc.py
          gofmt -w \
            internal/domain/gc.go \
            internal/ports/gc.go \
            internal/storage/sqlite/gc_candidates.go \
            internal/storage/sqlite/catalog_membership.go \
            internal/storage/sqlite/server_maintenance.go \
            internal/storage/sqlite/server_import_registration.go \
            internal/adapters/apt/gc.go \
            internal/adapters/pypi/gc.go \
            internal/adapters/npm/gc.go \
            internal/adapters/maven/gc.go \
            internal/service/gc.go \
            internal/service/gc_remove_linux.go \
            internal/service/gc_remove_other.go \
            internal/service/maintenance_runner.go \
            internal/server/gc.go \
            internal/server/maintenance.go \
            cmd/mirror-agent/main.go
          go mod tidy
          go build ./internal/...
          go build ./cmd/...
          GOOS=windows GOARCH=amd64 go build ./internal/...
      - name: Commit validated GC module
        run: |
          set -euo pipefail
          rm -f .airgap-dev/wire-gc.py .github/workflows/validate-gc.yml
          rmdir .airgap-dev 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: validate GC maintenance wiring'
          git push
