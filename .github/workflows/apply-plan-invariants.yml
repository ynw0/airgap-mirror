name: Apply plan invariants

on:
  push:
    paths:
      - '.github/workflows/apply-plan-invariants.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .airgap-dev/apply-plan-invariants.py
          gofmt -w internal/storage/sqlite/client.go
          go build ./internal/...
          go build ./cmd/...
      - name: Commit invariants
        shell: bash
        run: |
          set -euo pipefail
          rm -f .airgap-dev/apply-plan-invariants.py
          rmdir .airgap-dev 2>/dev/null || true
          rm -f .github/workflows/apply-plan-invariants.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce immutable publish unit plans"
          git push
