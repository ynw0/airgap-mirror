name: Apply npm module payload

on:
  push:
    paths:
      - '.airgap-dev/npm.payload.*'
      - '.github/workflows/apply-npm-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Apply payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .airgap-dev/npm.payload.1
          test -f .airgap-dev/npm.payload.2
          test -f .airgap-dev/npm.payload.3
          test -f .airgap-dev/npm.payload.4
          cat .airgap-dev/npm.payload.{1,2,3,4} | base64 -d > /tmp/npm-payload.tar.gz
          rm -f internal/storage/sqlite/server_core.go internal/storage/sqlite/server_import.go
          tar -xzf /tmp/npm-payload.tar.gz -C .
          gofmt -w internal/adapters/npm internal/ports internal/service internal/storage/sqlite
          go mod tidy
          go build ./internal/...
          go build ./cmd/...
      - name: Commit module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .airgap-dev
          rm -f .github/workflows/apply-npm-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement incremental npm adapter and metadata tombstones"
          git push
