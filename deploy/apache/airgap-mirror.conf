# Airgap Mirror Apache2 integration
#
# Enable required modules once:
#   sudo a2enmod proxy proxy_http alias
#
# Include these directives inside the internal repository VirtualHost, or adapt
# them to your existing site. Keep existing APT/PyPI/Maven static aliases intact.
#
# npm scoped packages may arrive as an encoded path. This directive is valid in
# server/vhost context and preserves encoded slashes for the Go gateway.
AllowEncodedSlashes NoDecode

ProxyRequests Off
ProxyTimeout 3600

# Windows desktop/control plane. Configure the desktop Agent URL as:
#   https://repo.internal/mirror-control
ProxyPass        /mirror-control/ http://127.0.0.1:8787/ nocanon
ProxyPassReverse /mirror-control/ http://127.0.0.1:8787/

# npm packument gateway. Registry clients use:
#   https://repo.internal/npm/<source-id>/
# The gateway only serves published packuments; tarballs remain Apache static files.
ProxyPass        /npm/ http://127.0.0.1:8787/npm/ nocanon
ProxyPassReverse /npm/ http://127.0.0.1:8787/npm/

# Existing static data plane examples only. Do NOT duplicate these if your current
# Apache site already exposes the repository trees at stable URLs.
#
# Alias /apt/       /srv/mirror/apt/
# Alias /pypi/      /srv/mirror/pypi/
# Alias /maven/     /srv/mirror/maven/
# Alias /npm-files/ /srv/mirror/npm/
#
# <Directory "/srv/mirror">
#     Options None
#     AllowOverride None
#     Require all granted
# </Directory>
#
# npm Source.publicUrl must point at the STATIC tarball root, for example:
#   https://repo.internal/npm-files/
# It must NOT point at /npm/, because /npm/ is the dynamic packument gateway.
